# Local Profile - Fast local persistent database
# Data is saved locally in ./data/pagareaderdb so it persists across restarts
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/pagareaderdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL & Application Logging in console
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.level.com.pagareader=DEBUG

# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
